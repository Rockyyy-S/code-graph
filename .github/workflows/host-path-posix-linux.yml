name: host-path-posix-linux

on:
  pull_request:
    paths:
      - ".github/workflows/host-path-posix-linux.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "ci/quality-gates.v1.yaml"
      - "rust-toolchain.toml"
      - "packages/adapters/host-path-posix-native/**"
      - "packaging/linux/**"
      - "scripts/ci/verify-host-path-posix-helper-v1.mjs"
      - "tests/contract/host-path-posix-helper-protocol.test.ts"
      - "tests/platform/linux-host-path-helper/**"
      - "tests/unit/host-path-posix-capability.test.ts"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot-helper-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve declared exact head SHA
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            exact_sha="$PR_HEAD_SHA"
          else
            exact_sha="$PUSH_HEAD_SHA"
          fi
          [[ "$exact_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$exact_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout declared exact head SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}
      - name: Assert checkout HEAD
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Install fixed pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
          version: 11.12.0
      - name: Install fixed Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: pnpm
          node-version: 24.18.0
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify snapshot-only helper core
        env:
          RUST_BACKTRACE: "1"
          SOURCE_DATE_EPOCH: "0"
        run: node scripts/ci/verify-host-path-posix-helper-v1.mjs
