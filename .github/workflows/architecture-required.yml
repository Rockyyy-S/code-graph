name: child-gate-evidence

on:
  pull_request:
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  gate-evidence:
    name: gate-evidence
    uses: Rockyyy-S/code-graph-gate-controller/.github/workflows/produce-gate-evidence.yml@0981130a71a3960aa374a82829d42aa9d9f15012
    with:
      base_oid: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      head_oid: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      object_format: sha1
      provider_repository_id: ${{ format('{0}', github.event.repository.id) }}
      producer_workflow_sha: 0981130a71a3960aa374a82829d42aa9d9f15012
      repository: ${{ github.repository }}
