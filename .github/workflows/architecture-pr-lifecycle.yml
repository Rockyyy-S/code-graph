name: architecture-pr-lifecycle

on:
  pull_request_target:
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  publish-pending:
    name: publish-pending
    uses: Rockyyy-S/code-graph-gate-controller/.github/workflows/publish-pr-pending.yml@c01e7c0550b9d9150df26c20cebb10aaefdf648d
    with:
      controller_workflow_sha: c01e7c0550b9d9150df26c20cebb10aaefdf648d
      head_oid: ${{ github.event.pull_request.head.sha }}
      lifecycle_action: ${{ github.event.action }}
      provider_repository_id: ${{ format('{0}', github.event.repository.id) }}
      pull_number: ${{ github.event.pull_request.number }}
      repository: ${{ github.repository }}
